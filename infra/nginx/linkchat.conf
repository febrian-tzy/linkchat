# ─── Nginx Configuration for LinkChat ───────────────────────────────────────
# Place this file at: /etc/nginx/sites-available/linkchat
# Then enable: ln -s /etc/nginx/sites-available/linkchat /etc/nginx/sites-enabled/
# Reload: sudo nginx -s reload

# Upstream: Go Backend API
upstream linkchat_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream: Next.js Frontend
upstream linkchat_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name linkchat.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkchat.yourdomain.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/linkchat.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkchat.yourdomain.com/privkey.pem;

    # SSL hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/linkchat_access.log;
    error_log  /var/log/nginx/linkchat_error.log;

    # Max upload size
    client_max_body_size 20M;

    # ── API routes → Go backend ──────────────────────────────────
    location /api/ {
        proxy_pass         http://linkchat_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        proxy_pass         http://linkchat_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Frontend → Next.js ───────────────────────────────────────
    location / {
        proxy_pass         http://linkchat_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets (cache aggressively) ───────────────
    location /_next/static/ {
        proxy_pass         http://linkchat_web;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
